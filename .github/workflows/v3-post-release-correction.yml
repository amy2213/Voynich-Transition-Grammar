name: Publish Version 3.0.0 correction notice

on:
  push:
    branches: [main]
    paths:
      - "docs/v3/post_release_defect_2026-09-29.md"
      - "docs/v3/github_release_v3.0.0_post_release_notice.md"

permissions:
  contents: write

jobs:
  correct-release-body:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify frozen Version 3.0.0 tag
        run: |
          git fetch --tags --force
          test "$(git rev-list -n 1 v3.0.0)" =             "b93e87468347c154cbe9c84cb12ebbbdc9823821"
      - name: Update GitHub release notice only
        run: |
          gh release edit v3.0.0             --notes-file docs/v3/github_release_v3.0.0_post_release_notice.md
