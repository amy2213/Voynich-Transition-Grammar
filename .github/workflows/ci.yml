name: Canonical pipeline and tests

on:
  push:
    branches: [main, v2-audit-consolidation]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install locked runtime inputs
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Compile every Python source
        run: python -m compileall -q scripts tests run_all.py

      - name: Run Version 3 regression controls
        run: >
          python -m pytest -q tests/test_canonical_values.py
          -k "CurrentPublicClaims or suffix_nesting or discovered_suffixes or composition_control or v3_comparator"

      - name: Run Version 3 candidate estimator smoke analysis
        run: python scripts/24_prefix_suffix_v3.py --replicates 20

      - name: Upload Version 3 candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: v3-candidate-evidence
          path: results/prefix_suffix_v3.json
          retention-days: 30

      - name: Run complete Version 2 canonical pipeline and full suite
        run: python run_all.py

      - name: Upload machine-readable run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: canonical-run-evidence
          path: |
            results/run_manifest.json
            results/test_report.json
            results/test_report.junit.xml
            results/classifier_overlap_report.json
            results/core_analysis_results.json
            results/prefix_suffix_v2.json
            results/prefix_suffix_v2.csv
            results/prefix_suffix_v2.md
            results/prefix_suffix_v2.svg
            results/prefix_suffix_v3.json
          retention-days: 30
