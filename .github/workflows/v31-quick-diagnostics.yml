name: Version 3.1 quick diagnostics

on:
  push:
    branches: [review/v3.1-position-threshold-diagnostics]
    paths:
      - "scripts/29_v31_quick_diagnostics.py"
      - ".github/workflows/v31-quick-diagnostics.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - run: python -m compileall -q scripts/28_v31_position_threshold_diagnostics.py scripts/29_v31_quick_diagnostics.py
      - run: python scripts/29_v31_quick_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: v3.1-quick-diagnostics
          path: results/v31_quick_diagnostics.json
          retention-days: 90
