name: Version 3 corrected release-candidate package

on:
  push:
    branches: [release/v3.0.0-final]
    paths:
      - "results/prefix_suffix_v3_validation.json"
      - "results/prefix_suffix_v3_validation_audit.md"
      - "results/prefix_suffix_v3_validation.sha256"
      - "docs/v2/post_release_defect_2026-09-29.md"
      - "docs/v2/canonical_claim_ledger.csv"
      - "docs/v3/**"
      - "README.md"
      - "RELEASE_NOTES.md"
      - "REPRODUCIBILITY.md"
      - "PROJECT_STATE.md"
      - ".github/workflows/v3-release-candidate-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact package head
        uses: actions/checkout@v4

      - name: Verify committed corrected evidence hashes
        run: |
          sha256sum -c results/prefix_suffix_v3_validation.sha256

      - name: Assemble corrected release-candidate evidence
        run: |
          mkdir -p package/results package/docs/v2 package/docs/v3
          cp results/prefix_suffix_v3_validation.json package/results/
          cp results/prefix_suffix_v3_validation_audit.md package/results/
          cp results/prefix_suffix_v3_validation.sha256 package/results/
          cp docs/v2/post_release_defect_2026-09-29.md package/docs/v2/
          cp docs/v2/canonical_claim_ledger.csv package/docs/v2/
          cp docs/v3/prefix_suffix_order_estimator_spec.md package/docs/v3/
          cp docs/v3/validation_interpretation.md package/docs/v3/
          cp docs/v3/release_candidate_addendum.md package/docs/v3/
          cp docs/v3/release_candidate_checklist.md package/docs/v3/
          cp docs/v3/release_candidate_manifest.md package/docs/v3/
          cp README.md package/
          cp RELEASE_NOTES.md package/
          cp REPRODUCIBILITY.md package/
          cp PROJECT_STATE.md package/

      - name: Write package manifest and checksums
        run: |
          cat > package/PACKAGE_MANIFEST.md <<EOF
          # Voynich Transition Grammar Version 3 corrected release-candidate package

          Package commit: ${GITHUB_SHA}
          Package workflow run: ${GITHUB_RUN_ID}

          Corrected scientific validation:
          - methodological head: cdbdc78f9887446b3b602349e22a4cfc30afc0f2
          - validation run ID: 36624694412
          - validation artifact ID: 11060002732
          - validation artifact SHA-256: 132ab897cb68a2d1ffe76c204000436761190939b0a4ea6aaca3d7a766fd1585
          - result: PASS

          Corrected canonical compatibility:
          - canonical run ID: 36624694574
          - canonical artifact ID: 11060427157
          - canonical artifact SHA-256: 3febe255027419722a452576ea5b06c80fb4458637d777001d62fa171665f944
          - result: PASS

          The committed validation JSON and audit are verified by
          results/prefix_suffix_v3_validation.sha256.

          This package is pre-release evidence only. It does not create the
          v3.0.0 tag or an archival DOI version.
          EOF

          find package -type f ! -name SHA256SUMS -print0 \
            | sort -z \
            | xargs -0 sha256sum > package/SHA256SUMS

          zip -r Voynich-v3.0.0-corrected-release-candidate-evidence.zip package
          sha256sum Voynich-v3.0.0-corrected-release-candidate-evidence.zip \
            > Voynich-v3.0.0-corrected-release-candidate-evidence.zip.sha256

      - name: Upload corrected evidence package
        uses: actions/upload-artifact@v4
        with:
          name: v3.0.0-corrected-release-candidate-evidence
          path: |
            Voynich-v3.0.0-corrected-release-candidate-evidence.zip
            Voynich-v3.0.0-corrected-release-candidate-evidence.zip.sha256
          retention-days: 90
