name: Claude quick pre-freeze diagnostics

on:
  push:
    branches: [review/claude-v3-pre-freeze]
    paths:
      - "scripts/27_claude_review_quick_diagnostics.py"
      - ".github/workflows/claude-quick-review.yml"
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - run: python scripts/27_claude_review_quick_diagnostics.py
      - uses: actions/upload-artifact@v4
        with:
          name: claude-quick-diagnostics
          path: results/claude_review_quick_diagnostics.json
          retention-days: 30
