name: Version 3.1 implementation tests

on:
  push:
    branches: [v3.1/position-aware-implementation]
    paths:
      - "scripts/_canonical.py"
      - "tests/test_canonical_values.py"
      - ".github/workflows/v31-implementation-tests.yml"
  workflow_dispatch:

jobs:
  test-v31-null:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile implementation and tests
        run: python -m compileall -q scripts/_canonical.py tests/test_canonical_values.py
      - name: Run Version 3.1 null tests
        run: >
          python -m pytest -q tests/test_canonical_values.py
          -k "v31_"
